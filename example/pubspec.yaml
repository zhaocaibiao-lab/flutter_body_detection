name: body_detection_example
description: 表情包工厂 - 基于 body_detection 插件的端侧去背表情包工具（截图/动态/照片），覆盖 iOS/Android 双端。

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  body_detection:
    # 依赖本插件（path 指向上一级 lib）
    path: ../

  cupertino_icons: ^1.0.2

  # 原示例已有
  file_picker: ^4.2.1
  permission_handler: ^8.1.6

  # 新增：表情包改造依赖
  image: ^3.3.0          # 逐像素合成透明 PNG / GIF 编解码 / 逐帧处理
  path_provider: ^2.1.0  # 导出文件到临时/文档目录
  share_plus: ^7.2.0     # 分享到微信/QQ（表情包添加）

flutter:
  uses-material-design: true
